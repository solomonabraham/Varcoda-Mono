# Builds the fonts from source on every push and pull request and fails when the
# committed fonts and sources are not what the program produces.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt afdko==5.0.1
      - name: Build into a scratch directory
        run: python scripts/build-fonts.py --root "$RUNNER_TEMP/out"
      - name: Committed fonts and sources are what the program builds
        run: |
          # Builds are byte-reproducible with the pinned packages (docs/BUILDING.md).
          status=0
          for f in fonts/ttf/*.ttf fonts/otf/*.otf fonts/webfonts/*; do
            cmp -s "$f" "$RUNNER_TEMP/out/$f" || { echo "::error file=$f::differs from a fresh build"; status=1; }
          done
          diff -rq sources "$RUNNER_TEMP/out/sources" || status=1
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: varcoda-mono-fonts
          path: ${{ runner.temp }}/out/fonts
